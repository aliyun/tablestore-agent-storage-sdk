[package]
name = "tablestore-agent-storage"
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
description = "Rust SDK for Tablestore agent storage (knowledge base + memory APIs)"
license = "Apache-2.0"
repository = "https://github.com/aliyun/tablestore-agent-storage-sdk"
keywords = ["tablestore", "aliyun", "agent", "storage", "knowledge-base"]
categories = ["api-bindings", "database"]

[features]
default = ["oss-upload", "rustls-tls"]
oss-upload = ["dep:tokio"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs"], optional = true }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
wiremock = "0.6"

[[example]]
name = "quickstart"
required-features = ["oss-upload"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
